# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Make sure to check the documentation at https://goreleaser.com
version: 2
project_name: batcher
git:
  # 版本号排序 tag，保证取到最新的 tag。
  # 注意必须用版本比较 key，写 "version" 会导致 git 报
  # unknown field name 错误，GoReleaser 会把这种失败误报成
  # "git doesn't contain any tags"。
  tag_sort: -version:refname
report_sizes: true

before:
  hooks:
    - go mod tidy

builds:
  - id: batcher
    main: ./cmd/batcher
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X "{{.ModulePath}}/internal/tui.version={{.Tag}}"
      - -X "{{.ModulePath}}/internal/tui.buildDate={{.Now}}"
      - -X "{{.ModulePath}}/internal/tui.gitCommit={{.FullCommit}}"
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "6"
      - "7"
    # Go 至少 1.15 起不再支持 darwin/386，darwin/arm 也从未被 Go 支持
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - "LICENSE"
      - "CHANGELOG.md"

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  # 预发布 tag（如 v0.0.5-rc.1）会被 GoReleaser 自动标记为 prerelease，
  # 这里显式声明，便于从 tag 名判断。
  mode: replace
  prerelease: auto
