name: Test

on:
  # 所有 PR 都运行检查，避免问题合并后才发现。
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"

jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Test
        run: go test -race -v -coverprofile=coverage.out -covermode=atomic ./internal/... ./cmd/batcher/...

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l internal cmd)"

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4
